[project]
name = "bower-bird"
version = "0.1.0"
description = "Research-profile capture loop: Telegram front door -> two-lane router -> vault writes (Clippings/ + reading-list)."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.49",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "markdownify>=1.2.3",
    "pypdf>=6.14.2",
]

[project.scripts]
bower-bird = "bower_bird.__main__:main"
bower_bird = "bower_bird.__main__:main"
bb = "bower_bird.__main__:main"
pull = "bower_bird.__main__:pull"
build = "bower_bird.__main__:build"
lint-source = "bower_bird.lint_source:main"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pre-commit>=4.0",
    "commitizen>=4.0",
    "ipykernel>=6.29",
]

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "D", "G", "LOG", "TID251"]
ignore = [
    "D100", # Modules stay without docstrings.
    "D104", # Packages stay without docstrings.
    "E501", # The formatter owns line length.
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"__future__.annotations".msg = "Use runtime annotations directly."
"dataclasses.dataclass".msg = "Use a Pydantic model or plain local values."
"dataclasses.make_dataclass".msg = "Use a Pydantic model or plain local values."
"pydantic.dataclasses.dataclass".msg = "Use BaseModel instead."

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_provider = "pep621"
version_files = ["src/bower_bird/__init__.py:__version__"]
major_version_zero = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bower_bird"]

# Path-based editable install: put src/ on sys.path so `python -m bower_bird`
# and submodule imports resolve consistently (the exact import-hook mode does
# not support `-m` package execution).
[tool.hatch.build]
dev-mode-dirs = ["src"]
