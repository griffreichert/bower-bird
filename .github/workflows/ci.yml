name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync deps (installs pinned Python)
        run: uv sync

      - name: Lint + format
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Tests
        run: |
          for f in tests/test_*.py; do
            echo "== $f =="
            uv run python "$f" || exit 1
          done
